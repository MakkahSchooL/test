<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقة تنفيذ برنامج نشاط طلابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F2;--surface:#FFFFFF;--ink:#13302E;--muted:#5A6F6C;--line:#D3DEDB;
  --brand:#0C6A64;--brand-ink:#FFFFFF;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;padding:20px 16px 80px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel h2{margin:0 0 10px;font-size:17px;color:var(--brand)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14.5px}
@media (max-width:600px){.form{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .15s}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hint{color:var(--muted);font-size:13.5px;margin:8px 0 0}

/* execution card */
.cardsbox{width:100%;display:flex;justify-content:center;margin-top:20px}
.card{width:210mm;height:297mm;background:#fff;color:#003845;position:relative;padding:7.7mm 10.8mm 6mm 9.8mm;font-family:"IBM Plex Sans Arabic","Sakkal Majalla",Tahoma,sans-serif;box-shadow:0 4px 20px rgba(0,40,50,.15);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;flex-shrink:0}
.cd-logo{position:absolute;top:7.7mm;left:8.8mm;width:30mm;text-align:center;line-height:1.25;color:#003845}
.cd-logo b{display:block;font-size:12pt}
.cd-logo span{font-size:7pt;letter-spacing:.2px}
.cd-title{margin:11mm 0 2mm;text-align:center;font-size:18pt;font-weight:700;color:#003744}
table.ct{width:100%;border-collapse:collapse;table-layout:fixed}
.ct td{border:1px solid #003845;padding:.5mm 1.5mm;text-align:center;vertical-align:middle;font-size:10.5pt;line-height:1.3}
.ct tr:nth-child(even) td{background:#D2E2E8}
.ct td.lb{font-weight:700;font-size:11.5pt}
.ce{display:block;min-height:1.2em;outline:0;border-radius:2px}
.ce.inl{display:inline-block;min-width:8mm}
.ce:focus{background:#FFF6CC}
.dpc{cursor:pointer}
.dpc:hover{background:#FFF6CC!important}
.dpc .cv{color:#0B5F55}
.pickhint{color:#9AA7A5;font-size:9pt}
.sdp{background:none;border:0;border-bottom:1px dashed #8FB0AC;padding:0 2px;font:inherit;color:#0B5F55;cursor:pointer;min-width:28mm;text-align:start}
.cd-sign{display:flex;justify-content:space-between;margin-top:2mm;font-size:11pt;line-height:1.8}
.cd-sign div{min-width:62mm}
.cd-sign b{display:block;font-weight:700}
.cd-note{margin-top:2mm;padding-inline-start:4mm;font-size:9.5pt;line-height:1.5;position:relative}
.cd-note::before{content:"•";position:absolute;inset-inline-start:0}
.cd-foot{position:absolute;bottom:0;left:0;right:0;height:6mm;background:linear-gradient(90deg,#2E8B57 0%,#20B2AA 50%,#4682B4 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-size:8pt;letter-spacing:1px}

/* Modal styles */
.modal{position:fixed;inset:0;background:rgba(8,26,26,.5);z-index:15;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}}
.mbox{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.mbox{border-radius:12px}}
.mhead{padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px}.mhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mtabs{display:flex;gap:6px;margin-top:10px}
.mbody{overflow-y:auto;padding:10px 12px}
.wk{border:1px solid var(--line);border-radius:9px;margin-bottom:6px;overflow:hidden}
.wk>button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--paper);border:0;padding:9px 12px;cursor:pointer;text-align:start}
.wk>button b{font-size:14.5px}.wk>button span{font-size:12.5px;color:var(--muted)}
.wk.cur>button{background:color-mix(in srgb,var(--brand) 14%,var(--paper))}
.etag{font-size:11.5px;font-weight:600;color:#9C6200;border:1px solid currentColor;border-radius:5px;padding:0 6px;margin-inline-start:6px}
.days{display:grid;gap:4px;padding:8px}
.day{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;cursor:pointer;text-align:start}
.day:hover:not(:disabled){border-color:var(--brand)}
.day.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));font-weight:700}
.day:disabled{opacity:.55;cursor:not-allowed}
.day em{font-style:normal;font-size:12px;color:var(--muted)}
.brk{text-align:center;font-size:12.5px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);border-radius:7px;padding:6px;margin:4px 0 10px}
.mfoot{display:flex;gap:8px;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.calpick{display:grid;gap:10px;padding:6px 2px}
.calpick button{text-align:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer}
.calpick b{display:block;font-size:15px}.calpick span{font-size:13px;color:var(--muted)}

.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.busy{position:fixed;inset:0;background:rgba(10,30,30,.45);display:flex;align-items:center;justify-content:center;z-index:20;color:#fff;font-weight:600;font-size:16px}
.shot{position:fixed;top:0;left:-20000px;background:#fff;direction:rtl}

@page cardp{size:A4 portrait;margin:0}
@media print{
  body{background:#fff;padding:0}
  .noprint{display:none!important}
  .wrap{max-width:none}
  .card{page:cardp;margin:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel noprint">
    <h2>إعدادات التقويم وشعار الوزارة</h2>
    <div class="form">
      <label>التقويم الدراسي المعتمد
        <select id="iCal">
          <option value="">— اختر التقويم —</option>
          <option value="west">مكة المكرمة، المدينة المنورة، جدة، الطائف</option>
          <option value="gen">جميع المناطق ماعدا الإدارات المستثناة</option>
        </select>
      </label>
      <label>شعار وزارة التعليم (اختياري)<input type="file" id="iLogo" accept="image/*"></label>
    </div>
    <div class="actions">
      <button class="btn primary" id="pdfCard">حفظ البطاقة PDF</button>
      <button class="btn" id="cPrint">طباعة البطاقة</button>
      <button class="btn" id="cReset">إعادة تعبئة / تفريغ الحقول</button>
    </div>
    <p class="hint">اضغط على خانات التاريخ (بداية التنفيذ أو نهاية التنفيذ) لاختيار الأسبوع واليوم مباشرة من التقويم الدراسي المعتمد لعام 1448هـ.</p>
  </div>

  <div class="cardsbox" id="cards"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const p2=n=>String(n).padStart(2,"0");
const esc=s=>String(s?="" "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse=s=>s.split("/").map(Number);
const key=([y,m,d])=>y*10000+m*100+d;
const dayn=([y,m,d])=>((y-1440)*12+(m-1))*29.53+d;

let T=[1448,4,21];
try{
  const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
  const g=t=>parseInt((p.find(x=>x.type===t)||{}).value);
  const y=g("year"),m=g("month"),d=g("day");
  if(y>1400&&m&&d)T=[y,m,d];
}catch(e){}
const TK=key(T),TN=dayn(T);

let S={info:{iCal:"west"},card:{},edits:{}};
try{const v=JSON.parse(localStorage.getItem("nashat-single-card-1448")||"null");if(v)S={...S,...v}}catch(e){}
if(!S.info.iCal)S.info.iCal="west"; // افتراضي مكة وطجيها لتظهر البطاقة بشكل سلس فوراً
const save=()=>{try{localStorage.setItem("nashat-single-card-1448",JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)};
const $=s=>document.querySelector(s);

if(S.info.iCal)$("#iCal").value=S.info.iCal;
$("#iCal").onchange=e=>{S.info.iCal=e.target.value;save();renderCard()};

$("#iLogo").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);S.info.logo=cv.toDataURL("image/png");save();renderCard();toast("تم حفظ الشعار")};im.src=rd.result};
  rd.readAsDataURL(f);
});

const HF=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric"});
function h2g(a){
  const base=new Date();base.setHours(12,0,0,0);
  const off=Math.round(dayn(a)-TN);
  for(const k of [0,-1,1,-2,2,-3,3]){
    const dt=new Date(base.getTime()+(off+k)*864e5),pp=HF.formatToParts(dt),g=t=>parseInt((pp.find(x=>x.type===t)||{}).value);
    if(g("year")===a[0]&&g("month")===a[1]&&g("day")===a[2])return dt;
  }
  return null;
}

      {n:16,exam:false,days:[{h:"1448/12/24",g:"30/5/2027",w:"الأحد"},{h:"1448/12/25",g:"31/5/2027",w:"الاثنين"},{h:"1448/12/26",g:"1/6/2027",w:"الثلاثاء"},{h:"1448/12/27",g:"2/6/2027",w:"الأربعاء"},{h:"1448/12/28",g:"3/6/2027",w:"الخميس"}]},
      {n:17,exam:false,days:[{h:"1449/01/01",g:"6/6/2027",w:"الأحد"},{h:"1449/01/02",g:"7/6/2027",w:"الاثنين"},{h:"1449/01/03",g:"8/6/2027",w:"الثلاثاء"},{h:"1449/01/04",g:"9/6/2027",w:"الأربعاء"},{h:"1449/01/05",g:"10/6/2027",w:"الخميس"}]},
      {n:18,exam:false,days:[{h:"1449/01/08",g:"13/6/2027",w:"الأحد"},{h:"1449/01/09",g:"14/6/2027",w:"الاثنين"},{h:"1449/01/10",g:"15/6/2027",w:"الثلاثاء"},{h:"1449/01/11",g:"16/6/2027",w:"الأربعاء"},{h:"1449/01/12",g:"17/6/2027",w:"الخميس"}]},
      {n:19,exam:true,days:[{h:"1449/01/15",g:"20/6/2027",w:"الأحد"},{h:"1449/01/16",g:"21/6/2027",w:"الاثنين"},{h:"1449/01/17",g:"22/6/2027",w:"الثلاثاء"},{h:"1449/01/18",g:"23/6/2027",w:"الأربعاء"},{h:"1449/01/19",g:"24/6/2027",w:"الخميس"}]}
    ],
    breaks:{s1:[[13,"إجازة الخريف","1448/06/10 – 1448/06/18هـ"]],s2:[[6,"إجازة عيد الفطر","1448/09/19 – 1448/10/05هـ"],[14,"إجازة عيد الأضحى","1448/12/01 – 1448/12/16هـ"]]}
  }
};

const CALN={west:"تقويم مكة المكرمة والمدينة المنورة وجدة والطائف",gen:"تقويم جميع المناطق ماعدا الإدارات المستثناة"};
const SEMN={s1:"الأول",s2:"الثاني"};

function calIdx(){
  const c=CAL[S.info.iCal];if(!c)return null;
  if(calIdx.k===S.info.iCal)return calIdx.m;
  const m={};for(const s of ["s1","s2"])c[s].forEach(wk=>wk.days.forEach(d=>{m[d.h]={...d,sem:s,n:wk.n,exam:wk.exam}}));
  calIdx.k=S.info.iCal;calIdx.m=m;return m;
}

function dayInfo(str){
  const a=parse(str);if(!a)return{day:"",week:"",date:"",term:""};
  const hs=`${a[0]}/${p2(a[1])}/${p2(a[2])}`,x=(calIdx()||{})[hs];
  if(x)return{day:x.w,week:ORD[x.n-1],date:`${p2(a[2])} / ${p2(a[1])} / ${a[0]}هـ`,term:SEMN[x.sem]};
  return{day:"",week:"",date:`${p2(a[2])} / ${p2(a[1])} / ${a[0]}هـ`,term:""};
}

let DP=null;
function openPicker(f){
  let sem="s1",open=null;
  const cur=S.card[f+"_h"],idx=calIdx(),x=cur&&idx&&idx[cur];
  if(x){sem=x.sem;open=x.n}
  DP={f,sem,open};drawPicker();
}

function drawPicker(){
  let m=$("#dpModal");
  if(!m){m=document.createElement("div");m.id="dpModal";m.className="modal noprint";m.addEventListener("click",pickClick);document.body.appendChild(m)}
  const lab={start:"بداية التنفيذ",end:"نهاية التنفيذ",tDate:"تاريخ المعلم",raedDate:"تاريخ رائد النشاط"}[DP.f];
  if(!S.info.iCal){
    m.innerHTML=`<div class="mbox"><div class="mhead"><h3>اختر التقويم الدراسي المعتمد أولاً</h3><p>من لوحة الإعدادات بالأعلى.</p></div>
    <div class="mbody"><div class="calpick">
      <button data-cal="west"><b>مكة المكرمة، المدينة المنورة، جدة، الطائف</b></button>
      <button data-cal="gen"><b>جميع المناطق ماعدا الإدارات المستثناة</b></button>
    </div></div><div class="mfoot"><span></span><button class="btn" data-x="close">إغلاق</button></div></div>`;return;
  }
  const C=CAL[S.info.iCal],weeks=C[DP.sem],brk=C.breaks[DP.sem],cur=S.card[DP.f+"_h"];
  const startV=DP.f==="end"?S.card.start_h:null;
  const rng=wk=>{const a=wk.days[0],b=wk.days[4];return `<bdi>${a.h.slice(5)}</bdi> – <bdi>${b.h.slice(5)}</bdi>هـ`};
  m.innerHTML=`<div class="mbox" role="dialog" aria-label="اختيار ${lab}">
    <div class="mhead"><h3>${lab}</h3><p>${CALN[S.info.iCal]}</p>
      <div class="mtabs"><button class="btn" data-sem="s1" aria-pressed="${DP.sem==="s1"}">الفصل الأول</button><button class="btn" data-sem="s2" aria-pressed="${DP.sem==="s2"}">الفصل الثاني</button></div></div>
    <div class="mbody">${weeks.map(wk=>{
      const isOpen=DP.open===wk.n,has=cur&&wk.days.some(d=>d.h===cur);
      const b=(brk.find(x=>x[0]===wk.n));
      return `<div class="wk ${has?"cur":""}"><button data-wk="${wk.n}" aria-expanded="${isOpen}"><b>الأسبوع ${ORD[wk.n-1]}${wk.exam?`<span class="etag">اختبارات</span>`:""}</b><span>${rng(wk)}</span></button>${isOpen?`<div class="days">${wk.days.map(d=>{const before=startV&&key(parse(d.h))<key(parse(startV));return `<button class="day ${d.h===cur?"on":""}" data-day="${d.h}" ${d.off\vert{}\vert{}before?"disabled":""}><b>${d.w}</b><span><bdi>${d.h}</bdi>هـ</span><em>${d.off||(before?"قبل البداية":"")}</em></button>`}).join("")}</div>`:""}</div>
      ${b?`<div class="brk">${b[1]}: ${b[2]}</div>`:""}`}).join("")}</div>
    <div class="mfoot"><button class="btn" data-x="clear">مسح التاريخ</button><button class="btn" data-x="close">إغلاق</button></div></div>`;
  const o=m.querySelector('.wk button[aria-expanded="true"]');if(o)o.scrollIntoView({block:"center"});
}
function closePicker(){const m=$("#dpModal");if(m)m.remove();DP=null}
function pickClick(e){
  const t=e.target.closest("button");
  if(!t){if(e.target.id==="dpModal")closePicker();return}
  if(t.dataset.cal){S.info.iCal=t.dataset.cal;$("#iCal").value=t.dataset.cal;save();drawPicker();return}
  if(t.dataset.sem){DP.sem=t.dataset.sem;DP.open=null;drawPicker();return}
  if(t.dataset.wk){const n=+t.dataset.wk;DP.open=DP.open===n?null:n;drawPicker();return}
  if(t.dataset.day){
    const a=parse(t.dataset.day);
    S.card[DP.f]=`${p2(a[2])} / ${p2(a[1])} / ${a[0]}هـ`;
    S.card[DP.f+"_h"]=t.dataset.day;
    const d=dayInfo(t.dataset.day);
    if(DP.f==="start"){S.card.s_day=d.day;S.card.s_week=d.week;if(d.term)S.card.term=d.term}
    if(DP.f==="end"){S.card.e_day=d.day;S.card.e_week=d.week}
    save();closePicker();renderCard();return;
  }
  if(t.dataset.x==="clear"){
    delete S.card[DP.f];delete S.card[DP.f+"_h"];
    if(DP.f==="start"){delete S.card.s_day;delete S.card.s_week}
    if(DP.f==="end"){delete S.card.e_day;delete S.card.e_week}
    save();closePicker();renderCard();return;
  }
  if(t.dataset.x==="close")closePicker();
}

function renderCard(){
  const C=S.card;
  const f=(k,inl)=>`<span class="ce${inl?" inl":""}" contenteditable="true" data-k="${k}">${esc(C[k]||"")}</span>`;
  const sd=k=>{const val=C[k]||"";return `<button class="sdp${val?"":" empty"}" data-sdp="${k}">${val?esc(val):'<span class="pickhint">اختر التاريخ</span>'}</button>`};
  const platforms=["بنك الإثراءات","التطوير الذاتي","قيمنا الغالية","نادي القراءة"];
  const curPlat=C["platform"]||"";

  $("#cards").innerHTML=`<div class="card">
    <div class="cd-logo">${S.info.logo?`<img src="${S.info.logo}" alt="" style="max-width:30mm;max-height:22mm">`:`<b>وزارة التعليم</b><span>Ministry of Education</span>`}</div>
    <div class="cd-title">بطاقة تنفيذ برنامج نشاط طلابي *</div>
    <table class="ct">
      <colgroup><col style="width:33%"><col style="width:22%"><col style="width:22%"><col style="width:23%"></colgroup>
      <tbody>
        <tr><td class="lb">اسم البرنامج</td><td colspan="3">${f("name")}</td></tr>
        <tr><td class="lb">المجال</td><td colspan="3">${f("dom")}</td></tr>
        <tr><td class="lb">عدد حصص البرنامج</td><td colspan="3">${f("sessions")}</td></tr>
        <tr><td class="lb">الفصل الدراسي</td><td colspan="3">${f("term")}</td></tr>
        
        <tr>
          <td class="lb">بداية التنفيذ</td>
          <td class="dpc" data-cdp="start">اليوم: <span class="cv">${esc(C.s_day||"")}</span></td>
          <td class="dpc" data-cdp="start">الأسبوع: <span class="cv">${esc(C.s_week||"")}</span></td>
          <td class="dpc" data-cdp="start">التاريخ: <span class="cv">${C.start?esc(C.start):'<span class="pickhint">اختر</span>'}</span></td>
        </tr>
        
        <tr>
          <td class="lb">نهاية التنفيذ</td>
          <td class="dpc" data-cdp="end">اليوم: <span class="cv">${esc(C.e_day||"")}</span></td>
          <td class="dpc" data-cdp="end">الأسبوع: <span class="cv">${esc(C.e_week||"")}</span></td>
          <td class="dpc" data-cdp="end">التاريخ: <span class="cv">${C.end?esc(C.end):'<span class="pickhint">اختر</span>'}</span></td>
        </tr>
        
        <tr><td class="lb">الصف</td><td colspan="3">${f("grade")}</td></tr>
        <tr><td class="lb">المعلم/ة المنفذ/ة</td><td colspan="3">${f("teacher")}</td></tr>
        <tr><td class="lb">عدد الطلبة المشاركين</td><td colspan="3">${f("participants")}</td></tr>
        <tr><td class="lb">عدد الطلبة المشاركين من ذوي الإعاقة</td><td colspan="3">${f("disabled")}</td></tr>
        <tr><td class="lb">عدد أولياء الأمور المشاركين في البرنامج</td><td colspan="3">${f("parents")}</td></tr>
        
        <tr>
          <td class="lb">عند تنفيذ المشاركة عبر منصة مدرستي ماهي أيقونة التنفيذ:</td>
          <td colspan="3" style="text-align:right;padding:5px 12px;">
            <div style="display:flex;flex-direction:column;gap:5px;">
              ${platforms.map(p=>`<label style="cursor:pointer;display:inline-flex;align-items:center;gap:8px;"><input type="radio" name="plat" value="${p}" ${curPlat===p?"checked":""} data-radio-plat="${p}"> ${p}</label>`).join("")}
            </div>
          </td>
        </tr>
        
        <tr>
          <td class="lb">عدد الشراكات المجتمعية</td>
          <td>${f("partnersN")}</td>
          <td class="lb">أسماء الشراكات المجتمعية</td>
          <td>${f("partners")}</td>
        </tr>
        
        <tr><td class="lb">ملاحظات</td><td colspan="3">${f("notes")}</td></tr>
      </tbody>
    </table>
    
    <div class="cd-sign">
      <div><b>المعلم/ة المنفذ/ة</b>الاسم: ${f("tName",1)}<br>التاريخ: ${sd("tDate")}<br>التوقيع:</div>
      <div><b>رائد/ة النشاط</b>الاسم: ${f("raedName",1)}<br>التاريخ: ${sd("raedDate")}<br>التوقيع:</div>
    </div>
    
    <div class="cd-note">يتم تعبئة هذه البطاقة عند استكمال الحصص المخصصة للبرنامج وفق ما ورد للبرنامج من حصص في دليل الخطط الدراسية / الإصدار السادس.</div>
    <div class="cd-foot">WWW.MOE.GOV.SA</div>
  </div>`;
  fitCard();
}

function fitCard(){
  const w=$(".cardsbox").clientWidth||794;
  const c=$("#cards .card");
  if(c){
    const scale = Math.min(1, (w - 4) / 794);
    c.style.transform = `scale(${scale})`;
    c.style.transformOrigin = "top center";
    // تعديل الهامش السفلي لتجنب الفراغ الناتج عن الـ scale
    c.style.marginBottom = `${(scale - 1) * c.offsetHeight}px`;
  }
}
window.addEventListener("resize",fitCard);

$("#cards").addEventListener("click",e=>{
  const a=e.target.closest("[data-cdp]");if(a)return openPicker(a.dataset.cdp);
  const b=e.target.closest("[data-sdp]");if(b)return openPicker(b.dataset.sdp);
});
$("#cards").addEventListener("change",e=>{
  const r=e.target.closest("[data-radio-plat]");
  if(r){S.card.platform=r.dataset.radioPlat;save()}
});
$("#cards").addEventListener("input",e=>{
  const el=e.target.closest(".ce");if(!el)return;
  S.card[el.dataset.k]=el.textContent.trim();save();
});
$("#cReset").onclick=()=>{if(confirm("هل تريد تفريغ جميع الحقول؟")){S.card={};save();renderCard();toast("تم التفريغ")}};

const loadJS=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)});
async function libs(){
  await loadJS("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
function busy(on,msg){let b=$("#busy");if(on){if(!b){b=document.createElement("div");b.id="busy";b.className="busy";document.body.appendChild(b)}b.textContent=msg||"جارٍ تجهيز الملف…"}else if(b)b.remove()}

async function snap(node,widthPx){
  const box=document.createElement("div");box.className="shot";box.style.width=widthPx+"px";
  const cl=node.cloneNode(true);cl.style.transform="none";cl.style.marginBottom="0";
  box.appendChild(cl);document.body.appendChild(box);
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    return await html2canvas(cl,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:widthPx});}
  finally{box.remove()}
}

$("#pdfCard").onclick=async()=>{
  busy(true,"جارٍ تجهيز البطاقة PDF…");
  try{
    await libs();
    const cv=await snap($("#cards .card"),794);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,210,297);
    const blob=pdf.output("blob");
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="بطاقة_تنفيذ_برنامج_نشاط.pdf";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);toast("تم حفظ الملف");
  }catch(e){toast("تعذّر إنشاء PDF")}
  finally{busy(false)}
};

$("#cPrint").onclick=async()=>{
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let w=null;
  if(!isIOS){try{w=window.open("","_blank")}catch(e){}}
  busy(true,"جارٍ تجهيز البطاقة للطباعة…");
  try{
    await libs();
    const cv=await snap($("#cards .card"),794);
    const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,210,297);
    busy(false);
    if(w&&!w.closed){
      pdf.autoPrint();
      const url=URL.createObjectURL(pdf.output("blob"));w.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),600000);
    }else{
      const blob=pdf.output("blob"),url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="بطاقة_تنفيذ_برنامج_نشاط.pdf";document.body.appendChild(a);a.click();a.remove();
      toast("تم حفظ الملف للطباعة");
    }
  }catch(e){busy(false);if(w&&!w.closed)w.close();toast("تعذّر الطباعة")}
};

// تشغيل العرض الفوري للبطاقة عند فتح الصفحة
renderCard();
</script>
